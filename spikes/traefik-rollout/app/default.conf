server {
    listen 80;
    listen [::]:80;

    # Route de santé utilisée par le healthcheck Docker, docker-rollout et Traefik.
    # Si le fichier /tmp/draining existe (créé par le hook de déploiement juste avant
    # l'arrêt de l'ancien conteneur), la route répond 503 : Traefik retire alors ce
    # conteneur du routage avant qu'il ne soit arrêté (drainage de connexions).
    location = /health {
        access_log off;
        default_type text/plain;
        if (-f /tmp/draining) {
            return 503 'draining';
        }
        return 200 'ok';
    }

    # Page d'accueil : affiche la version et le conteneur qui répond
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
    }
}
