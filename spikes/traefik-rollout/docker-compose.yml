services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true          # tableau de bord (spike uniquement, à retirer en production)
    ports:
      - "8088:80"                    # trafic applicatif (le port 80 est pris sur cette machine)
      - "8081:8080"                  # tableau de bord Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-v1}
    image: spike-web:${APP_VERSION:-v1}
    restart: unless-stopped
    # Contraintes de docker-rollout : pas de container_name, pas de "ports:" publiés.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=80
      # Sonde de santé propre à Traefik : un conteneur qui répond 503 sur /health
      # est retiré du routage en ~1 s (utilisé pour le drainage avant l'arrêt).
      - traefik.http.services.web.loadbalancer.healthcheck.path=/health
      - traefik.http.services.web.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.web.loadbalancer.healthcheck.timeout=1s
