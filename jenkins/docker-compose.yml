services:
  jenkins:
    build: .
    image: jenkins-custom:jdk25
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"      # interface web
      - "50000:50000"    # agents JNLP
    volumes:
      - jenkins_home:/var/jenkins_home
      # Optionnel : pour builder/scanner des images Docker locales (nécessite docker-cli dans l'image)
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
